<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>本地图片列表（6×5=30/页）+ 全选/勾选 + 批量下载</title>
    <style>
        :root{
            --bg1:#0b1220; --bg2:#12263b;
            --card: rgba(255,255,255,.08);
            --border: rgba(255,255,255,.14);
            --text: rgba(255,255,255,.92);
            --muted: rgba(255,255,255,.65);
            --shadow: 0 18px 50px rgba(0,0,0,.35);
            --shadow2: 0 10px 24px rgba(0,0,0,.25);
            --accent: rgba(56,189,248,.55);
            --good: rgba(74,222,128,.75);
        }
        *{ box-sizing:border-box; }
        body{
            margin:0; min-height:100vh; color:var(--text);
            font-family: system-ui, -apple-system, "PingFang SC","Microsoft YaHei", Arial, sans-serif;
            background:
                    radial-gradient(1000px 600px at 10% 10%, rgba(56,189,248,.18), transparent 55%),
                    radial-gradient(900px 600px at 90% 15%, rgba(167,139,250,.16), transparent 55%),
                    linear-gradient(135deg, var(--bg1), var(--bg2));
        }
        .wrap{ max-width: 1200px; margin: 0 auto; padding: 20px 16px 40px; }
        h1{ margin:0; font-size: 20px; font-weight: 850; }
        .sub{ margin-top:6px; color:var(--muted); font-size:13px; line-height:1.6; }

        .card{
            margin-top: 14px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow:hidden;
        }
        .toolbar{
            display:flex; flex-wrap: wrap; gap:10px; align-items:center;
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255,255,255,.10);
        }
        .btn{
            border: 1px solid rgba(255,255,255,.16);
            background: rgba(255,255,255,.08);
            color: var(--text);
            padding: 9px 12px;
            border-radius: 12px;
            cursor:pointer;
            font-weight: 650;
            transition: transform .12s ease, background .12s ease, border-color .12s ease, opacity .12s ease;
            user-select:none;
            white-space: nowrap;
        }
        .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.11); border-color: rgba(255,255,255,.26); }
        .btn:active{ transform: translateY(0px); opacity:.95; }
        .btn:disabled{ cursor:not-allowed; opacity:.45; transform:none; }
        .btn.primary{ border-color: rgba(56,189,248,.35); background: rgba(56,189,248,.10); }
        .btn.good{ border-color: rgba(74,222,128,.35); background: rgba(74,222,128,.10); }

        .select{
            padding: 9px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.16);
            background: rgba(255,255,255,.06);
            color: var(--text);
            outline: none;
        }
        .meta{ margin-left:auto; color: var(--muted); font-size: 12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
        .pill{
            padding: 6px 10px;
            border-radius: 999px;
            border:1px solid rgba(255,255,255,.14);
            background: rgba(255,255,255,.06);
            color: rgba(255,255,255,.78);
            font-size: 12px;
            white-space: nowrap;
        }

        .drop{
            margin: 14px;
            border-radius: 16px;
            border: 1px dashed rgba(255,255,255,.24);
            background: rgba(0,0,0,.12);
            padding: 14px;
            color: rgba(255,255,255,.70);
            line-height: 1.6;
        }
        .drop.dragover{
            border-color: rgba(56,189,248,.60);
            background: rgba(56,189,248,.08);
            box-shadow: 0 0 0 3px rgba(56,189,248,.12) inset;
        }

        /* ✅ 固定 6 列；每页只渲染 30 张 => 最多 5 行 */
        .grid{
            padding: 0 14px 14px;
            display:grid;
            gap: 12px;
            grid-template-columns: repeat(6, minmax(0, 1fr));
        }

        .tile{
            border-radius: 14px; overflow:hidden;
            border: 1px solid rgba(255,255,255,.12);
            background: rgba(0,0,0,.20);
            box-shadow: var(--shadow2);
            cursor: zoom-in;
            transition: transform .12s ease, border-color .12s ease;
            position: relative;
        }
        .tile:hover{ transform: translateY(-1px); border-color: rgba(56,189,248,.35); }

        .frame{
            width:100%;
            aspect-ratio: 9 / 16;
            background: rgba(255,255,255,.06);
            position: relative;
        }
        .frame img{
            width:100%; height:100%;
            object-fit: cover;
            display:block;
        }
        .skeleton{
            position:absolute; inset:0;
            background: linear-gradient(90deg, rgba(255,255,255,.06), rgba(255,255,255,.12), rgba(255,255,255,.06));
            animation: shimmer 1.1s infinite;
        }
        @keyframes shimmer{
            0%{ transform: translateX(-40%); }
            100%{ transform: translateX(40%); }
        }

        .caption{
            padding: 8px 10px;
            font-size: 12px;
            color: rgba(255,255,255,.75);
            border-top: 1px solid rgba(255,255,255,.08);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* ✅ 选择小圆圈（左上角） */
        .selector{
            position:absolute;
            top: 8px; left: 8px;
            width: 40px; height: 40px;
            border-radius: 999px;
            border: 2px solid rgba(255,255,255,.75);
            background: rgba(0,0,0,.25);
            display:none;
            align-items:center;
            justify-content:center;
            z-index: 5;
            cursor: pointer;
            user-select:none;
            box-shadow: 0 8px 16px rgba(0,0,0,.35);
        }
        .selector.show{ display:flex; }
        .selector.checked{
            border-color: rgba(74,222,128,.85);
            background: rgba(74,222,128,.18);
        }
        .checkmark{
            width: 20px; height: 12px;
            border-left: 2px solid rgba(255,255,255,.92);
            border-bottom: 2px solid rgba(255,255,255,.92);
            transform: rotate(-45deg);
            margin-top: -1px;
            display:none;
        }
        .selector.checked .checkmark{ display:block; }

        /* 分页 */
        .pager{
            display:flex; gap:10px; align-items:center; justify-content:center;
            padding: 10px 14px 14px; color: rgba(255,255,255,.80);
            flex-wrap: wrap;
        }
        .pager .btn{ padding: 8px 10px; border-radius: 999px; }
        .pageInfo{
            font-size: 12px; color: rgba(255,255,255,.72);
            padding: 6px 10px; border-radius: 999px;
            border: 1px solid rgba(255,255,255,.14);
            background: rgba(255,255,255,.06);
            white-space: nowrap;
        }
        .pageJump{ display:flex; gap:8px; align-items:center; font-size: 12px; color: rgba(255,255,255,.72); }
        .pageJump input{
            width: 90px; padding: 8px 10px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,.16);
            background: rgba(255,255,255,.06);
            color: var(--text); outline: none;
        }

        /* 预览遮罩层 */
        .overlay{
            position: fixed; inset: 0;
            display:none; align-items:center; justify-content:center;
            padding: 22px;
            background: rgba(0,0,0,.68);
            z-index: 9999;
        }
        .overlay.show{ display:flex; }
        .modal{
            width: min(520px, 92vw);
            border-radius: 18px;
            overflow:hidden;
            border: 1px solid rgba(255,255,255,.18);
            background: rgba(10,12,18,.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 30px 80px rgba(0,0,0,.55);
            cursor: default;
        }
        .modalFrame{ width:100%; aspect-ratio: 9 / 16; background: rgba(255,255,255,.05); }
        .modalFrame img{ width:100%; height:100%; object-fit: contain; display:block; background: rgba(0,0,0,.20); }
        .modalBar{
            display:flex; justify-content:space-between; gap:10px; align-items:center;
            padding: 10px 12px;
            border-top: 1px solid rgba(255,255,255,.10);
            color: rgba(255,255,255,.78);
            font-size: 12px;
        }
        .xbtn{
            border: 1px solid rgba(255,255,255,.14);
            background: rgba(255,255,255,.06);
            color: rgba(255,255,255,.86);
            padding: 6px 10px;
            border-radius: 999px;
            cursor:pointer;
            font-weight: 700;
        }
        .xbtn:hover{ border-color: rgba(56,189,248,.35); background: rgba(56,189,248,.10); }

        input[type="file"]{ display:none; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>图片列表（6列×5行=30/页）+ 全选/勾选 + 一键下载</h1>
    <div class="sub">
        选择文件夹/图片可追加上传（不覆盖），重复会自动跳过。点“全选”后出现左上角小圆圈可勾选；点“下载”会批量下载选中图片。
        （提示：部分浏览器可能会对“批量自动下载”弹出确认或限制。）
    </div>

    <div class="card">
        <div class="toolbar">
            <button class="btn" id="pickFolderBtn">选择文件夹追加</button>
            <button class="btn" id="pickImagesBtn">选择图片追加</button>
            <button class="btn" id="clearBtn" disabled>清空全部</button>

            <label style="display:flex; gap:8px; align-items:center; color:rgba(255,255,255,.75); font-size:12px;">
                排序：
                <select class="select" id="sortSel">
                    <option value="nameAsc">文件名 A→Z</option>
                    <option value="nameDesc">文件名 Z→A</option>
                    <option value="timeDesc">修改时间 新→旧</option>
                    <option value="timeAsc">修改时间 旧→新</option>
                </select>
            </label>

            <button class="btn primary" id="selectAllBtn" disabled>全选（当前页）</button>
            <button class="btn" id="clearSelBtn" disabled>清空选择</button>
            <button class="btn good" id="downloadBtn" disabled>下载选中（0）</button>

            <div class="meta">
                <span class="pill" id="metaText">0 张 · 0 页</span>
                <span class="pill" id="dupText">本次跳过重复：0</span>
                <span class="pill" id="thumbText">缩略图：0 / 0</span>
                <span class="pill" id="selText">已选：0</span>
            </div>
        </div>

        <div id="dropZone" class="drop">
            可拖拽 <b>多张图片</b> 到此处（拖文件夹在部分浏览器不稳定）。<br/>
            去重：<b>相对路径/文件名 + 文件大小 + 最后修改时间</b> 相同则跳过。列表用缩略图提升性能。
        </div>

        <div id="grid" class="grid"></div>

        <div class="pager" id="pager" style="display:none;">
            <button class="btn" id="prevBtn">上一页</button>
            <div class="pageInfo" id="pageInfo">第 1 / 1 页（每页 30 张）</div>
            <button class="btn" id="nextBtn">下一页</button>

            <div class="pageJump">
                跳转到
                <input id="jumpInput" type="number" min="1" step="1" placeholder="页码" />
                <button class="btn" id="jumpBtn">跳转</button>
            </div>
        </div>
    </div>

    <input id="folderInput" type="file" webkitdirectory multiple accept="image/*">
    <input id="imagesInput" type="file" multiple accept="image/*">

    <div class="overlay" id="overlay">
        <div class="modal" id="modal">
            <div class="modalFrame"><img id="modalImg" alt="preview" /></div>
            <div class="modalBar">
                <div id="modalName" title=""></div>
                <button class="xbtn" id="closeBtn">关闭</button>
            </div>
        </div>
    </div>
</div>

<script>
    const pickFolderBtn = document.getElementById('pickFolderBtn');
    const pickImagesBtn = document.getElementById('pickImagesBtn');
    const clearBtn = document.getElementById('clearBtn');
    const folderInput = document.getElementById('folderInput');
    const imagesInput = document.getElementById('imagesInput');
    const grid = document.getElementById('grid');
    const metaText = document.getElementById('metaText');
    const dupText = document.getElementById('dupText');
    const thumbText = document.getElementById('thumbText');
    const sortSel = document.getElementById('sortSel');
    const dropZone = document.getElementById('dropZone');

    const selectAllBtn = document.getElementById('selectAllBtn');
    const clearSelBtn = document.getElementById('clearSelBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const selText = document.getElementById('selText');

    const pager = document.getElementById('pager');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageInfo = document.getElementById('pageInfo');
    const jumpInput = document.getElementById('jumpInput');
    const jumpBtn = document.getElementById('jumpBtn');

    const overlay = document.getElementById('overlay');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');
    const modalName = document.getElementById('modalName');
    const closeBtn = document.getElementById('closeBtn');

    // ✅ 6×5=30
    const PAGE_SIZE = 30;

    // 缩略图（9:16）
    const THUMB_W = 270;
    const THUMB_H = Math.round(270 * 16/9);
    const THUMB_MIME = 'image/webp';
    const THUMB_QUALITY = 0.72;
    const THUMB_CONCURRENCY = 3;

    // items: { key, name, file, fullUrl, thumbUrl?, thumbReady, size, lastModified }
    let items = [];
    const keySet = new Set();

    let currentPage = 1;
    let lastSkippedDup = 0;
    let thumbReadyCount = 0;

    // 选择状态：保存被选中的 item.key
    const selectedKeys = new Set();

    // 是否显示左上角小圆圈（点全选后启用）
    let selectionMode = false;

    // 缩略图队列
    const thumbQueue = [];
    let runningThumbTasks = 0;

    const IMG_EXT_OK = new Set(['.jpg','.jpeg','.png','.webp','.gif','.bmp','.avif']);

    pickFolderBtn.addEventListener('click', () => folderInput.click());
    pickImagesBtn.addEventListener('click', () => imagesInput.click());

    folderInput.addEventListener('change', () => {
        appendFiles(Array.from(folderInput.files || []));
        folderInput.value = '';
    });
    imagesInput.addEventListener('change', () => {
        appendFiles(Array.from(imagesInput.files || []));
        imagesInput.value = '';
    });

    clearBtn.addEventListener('click', () => {
        cleanupAllUrls();
        items = [];
        keySet.clear();
        thumbQueue.length = 0;
        runningThumbTasks = 0;
        currentPage = 1;
        lastSkippedDup = 0;
        thumbReadyCount = 0;

        selectedKeys.clear();
        selectionMode = false;

        render();
    });

    sortSel.addEventListener('change', () => render());

    // 拖拽
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        appendFiles(Array.from(e.dataTransfer.files || []));
    });

    // 分页
    prevBtn.addEventListener('click', () => { if (currentPage > 1) { currentPage--; render(); scrollToTopOfGrid(); } });
    nextBtn.addEventListener('click', () => { if (currentPage < totalPages()) { currentPage++; render(); scrollToTopOfGrid(); } });
    jumpBtn.addEventListener('click', () => {
        const n = parseInt(jumpInput.value, 10);
        if (!Number.isFinite(n)) return;
        currentPage = clamp(n, 1, totalPages());
        render();
        scrollToTopOfGrid();
    });

    // ✅ 全选按钮：点一次 => 开启选择模式 + 全选当前页；再点一次 => 取消当前页全选
    selectAllBtn.addEventListener('click', () => {
        if (!items.length) return;
        selectionMode = true;
        const pageKeys = getCurrentPageItems().map(it => it.key);
        const allSelected = pageKeys.every(k => selectedKeys.has(k));

        if (allSelected) {
            // 当前页全取消
            pageKeys.forEach(k => selectedKeys.delete(k));
        } else {
            // 当前页全选
            pageKeys.forEach(k => selectedKeys.add(k));
        }
        updateSelectionUI();
        render(); // 更新圆圈勾选态
    });

    clearSelBtn.addEventListener('click', () => {
        selectedKeys.clear();
        updateSelectionUI();
        render();
    });

    // ✅ 下载选中：逐个触发下载
    downloadBtn.addEventListener('click', async () => {
        const selected = items.filter(it => selectedKeys.has(it.key));
        if (!selected.length) return;

        // 逐个触发下载，避免一次性太猛
        for (let i = 0; i < selected.length; i++){
            const it = selected[i];
            triggerDownload(it.fullUrl, safeFilename(it.name || `image_${i+1}`));
            // 小延迟，降低浏览器拦截概率
            await sleep(180);
        }
    });

    // 预览：点击空白关闭
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closePreview(); });
    closeBtn.addEventListener('click', closePreview);
    modal.addEventListener('click', (e) => e.stopPropagation());
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && overlay.classList.contains('show')) closePreview(); });

    function isImageFile(file){
        const name = (file.name || '').toLowerCase();
        for (const ext of IMG_EXT_OK) if (name.endsWith(ext)) return true;
        return (file.type || '').startsWith('image/');
    }

    function makeKey(file){
        const rel = file.webkitRelativePath || file.name || 'unknown';
        const size = file.size ?? 0;
        const lm = file.lastModified ?? 0;
        return `${rel}__${size}__${lm}`;
    }

    function appendFiles(files){
        const imgs = files.filter(isImageFile);
        let added = 0, skipped = 0;

        for (const file of imgs){
            const key = makeKey(file);
            if (keySet.has(key)) { skipped++; continue; }
            keySet.add(key);

            const name = file.webkitRelativePath || file.name;
            const fullUrl = URL.createObjectURL(file);

            const it = {
                key, name, file,
                fullUrl,
                thumbUrl: null,
                thumbReady: false,
                size: file.size ?? 0,
                lastModified: file.lastModified ?? 0
            };

            items.push(it);
            added++;

            enqueueThumbTask(it);
        }

        lastSkippedDup = skipped;
        dupText.textContent = `本次跳过重复：${lastSkippedDup}`;

        if (items.length > 0) {
            clearBtn.disabled = false;
            selectAllBtn.disabled = false;
            clearSelBtn.disabled = false;
            currentPage = totalPages(); // 追加后跳到最后一页
        } else {
            clearBtn.disabled = true;
            selectAllBtn.disabled = true;
            clearSelBtn.disabled = true;
            currentPage = 1;
        }

        // 选择模式：保持不变
        updateSelectionUI();
        render();
        if (added > 0) scrollToTopOfGrid();
    }

    function totalPages(){
        return Math.ceil(getSortedItems().length / PAGE_SIZE) || 1;
    }

    function getSortedItems(){
        const arr = items.slice();
        const mode = sortSel.value;

        arr.sort((a,b) => {
            if (mode === 'nameAsc' || mode === 'nameDesc') {
                const na = a.name.toLowerCase(), nb = b.name.toLowerCase();
                if (na === nb) return 0;
                return mode === 'nameAsc' ? (na < nb ? -1 : 1) : (na > nb ? -1 : 1);
            }
            if (mode === 'timeDesc' || mode === 'timeAsc') {
                const ta = a.lastModified || 0, tb = b.lastModified || 0;
                if (ta === tb) return 0;
                return mode === 'timeDesc' ? (ta > tb ? -1 : 1) : (ta < tb ? -1 : 1);
            }
            return 0;
        });

        return arr;
    }

    function getCurrentPageItems(){
        const list = getSortedItems();
        const pages = Math.ceil(list.length / PAGE_SIZE) || 1;
        currentPage = clamp(currentPage, 1, pages);

        const start = (currentPage - 1) * PAGE_SIZE;
        const end = Math.min(start + PAGE_SIZE, list.length);
        return list.slice(start, end);
    }

    function render(){
        grid.innerHTML = '';

        const list = getSortedItems();
        const pages = Math.ceil(list.length / PAGE_SIZE) || 1;
        currentPage = clamp(currentPage, 1, pages);

        metaText.textContent = `${list.length} 张 · ${pages} 页`;
        clearBtn.disabled = list.length === 0;
        selectAllBtn.disabled = list.length === 0;
        clearSelBtn.disabled = list.length === 0;

        pager.style.display = list.length > 0 ? 'flex' : 'none';
        pageInfo.textContent = `第 ${currentPage} / ${pages} 页（每页 ${PAGE_SIZE} 张）`;
        prevBtn.disabled = currentPage <= 1;
        nextBtn.disabled = currentPage >= pages;

        thumbText.textContent = `缩略图：${thumbReadyCount} / ${items.length}`;
        updateSelectionUI();

        if (list.length === 0) return;

        const pageItems = getCurrentPageItems();
        const frag = document.createDocumentFragment();

        for (const it of pageItems){
            const tile = document.createElement('div');
            tile.className = 'tile';

            const selector = document.createElement('div');
            selector.className = 'selector' + (selectionMode ? ' show' : '') + (selectedKeys.has(it.key) ? ' checked' : '');
            selector.innerHTML = `<div class="checkmark"></div>`;

            // 点圆圈：勾选/取消（不触发预览）
            selector.addEventListener('click', (e) => {
                e.stopPropagation();
                selectionMode = true;
                if (selectedKeys.has(it.key)) selectedKeys.delete(it.key);
                else selectedKeys.add(it.key);
                updateSelectionUI();
                // 更新自身状态
                selector.classList.toggle('checked', selectedKeys.has(it.key));
            });

            const frame = document.createElement('div');
            frame.className = 'frame';

            const img = document.createElement('img');
            img.loading = 'lazy';
            img.decoding = 'async';

            const sk = document.createElement('div');
            sk.className = 'skeleton';

            if (it.thumbReady && it.thumbUrl) {
                img.src = it.thumbUrl;
                sk.style.display = 'none';
            } else {
                img.src = '';
                sk.style.display = 'block';
            }

            // 缩略图就绪时局部刷新
            it._onThumbReady = () => {
                if (it.thumbReady && it.thumbUrl) {
                    img.src = it.thumbUrl;
                    sk.style.display = 'none';
                }
            };

            frame.appendChild(img);
            frame.appendChild(sk);

            const cap = document.createElement('div');
            cap.className = 'caption';
            cap.textContent = it.name;

            tile.appendChild(frame);
            tile.appendChild(cap);
            tile.appendChild(selector);

            // 点图片：放大预览（如果在选择模式，你仍然可以点图片看大图；勾选请点圆圈）
            tile.addEventListener('click', () => openPreview(it));

            frag.appendChild(tile);
        }

        grid.appendChild(frag);
    }

    function updateSelectionUI(){
        const n = selectedKeys.size;
        selText.textContent = `已选：${n}`;
        downloadBtn.disabled = n === 0;
        downloadBtn.textContent = `下载选中（${n}）`;

        // 只要你点过“全选”或点过圆圈，就认为进入选择模式
        // 如果你希望“没选中任何图时自动退出选择模式”，可以在这里加逻辑
    }

    function openPreview(item){
        modalImg.src = item.fullUrl;
        modalName.textContent = item.name;
        modalName.title = item.name;
        overlay.classList.add('show');
        document.body.style.overflow = 'hidden';
    }
    function closePreview(){
        overlay.classList.remove('show');
        document.body.style.overflow = '';
    }

    function cleanupAllUrls(){
        for (const it of items) {
            try { URL.revokeObjectURL(it.fullUrl); } catch {}
            if (it.thumbUrl && it.thumbUrl !== it.fullUrl) {
                try { URL.revokeObjectURL(it.thumbUrl); } catch {}
            }
        }
    }

    function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

    function scrollToTopOfGrid(){
        const top = grid.getBoundingClientRect().top + window.scrollY - 10;
        window.scrollTo({ top, behavior: 'smooth' });
    }

    function scheduleIdle(fn){
        if ('requestIdleCallback' in window) requestIdleCallback(() => fn(), { timeout: 500 });
        else setTimeout(() => fn(), 16);
    }

    function enqueueThumbTask(item){
        thumbQueue.push(item);
        pumpThumbQueue();
    }

    function pumpThumbQueue(){
        while (runningThumbTasks < THUMB_CONCURRENCY && thumbQueue.length > 0) {
            const item = thumbQueue.shift();
            runningThumbTasks++;
            scheduleIdle(async () => {
                try {
                    const thumbUrl = await buildThumbUrl(item.file);
                    item.thumbUrl = thumbUrl;
                    item.thumbReady = true;
                    thumbReadyCount++;
                    thumbText.textContent = `缩略图：${thumbReadyCount} / ${items.length}`;
                    if (typeof item._onThumbReady === 'function') item._onThumbReady();
                } catch (e) {
                    // 失败则退化
                    item.thumbUrl = item.fullUrl;
                    item.thumbReady = true;
                    thumbReadyCount++;
                    if (typeof item._onThumbReady === 'function') item._onThumbReady();
                } finally {
                    runningThumbTasks--;
                    pumpThumbQueue();
                }
            });
        }
    }

    async function buildThumbUrl(file){
        let bmp;
        try{
            bmp = await createImageBitmap(file, { premultiplyAlpha: 'none' });
        }catch{
            bmp = await decodeViaImg(file);
        }

        const srcW = bmp.width, srcH = bmp.height;
        const targetRatio = 9/16;
        const srcRatio = srcW / srcH;

        let sx=0, sy=0, sw=srcW, sh=srcH;
        if (srcRatio > targetRatio) {
            sh = srcH;
            sw = Math.round(srcH * targetRatio);
            sx = Math.floor((srcW - sw) / 2);
        } else {
            sw = srcW;
            sh = Math.round(srcW / targetRatio);
            sy = Math.floor((srcH - sh) / 2);
        }

        const canvas = document.createElement('canvas');
        canvas.width = THUMB_W;
        canvas.height = THUMB_H;

        const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(bmp, sx, sy, sw, sh, 0, 0, THUMB_W, THUMB_H);

        try { bmp.close && bmp.close(); } catch {}

        const blob = await new Promise((resolve, reject) => {
            canvas.toBlob((b) => b ? resolve(b) : reject(new Error('toBlob failed')), THUMB_MIME, THUMB_QUALITY);
        });

        return URL.createObjectURL(blob);
    }

    function decodeViaImg(file){
        return new Promise((resolve, reject) => {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = async () => {
                try{
                    const bmp = await createImageBitmap(img);
                    URL.revokeObjectURL(url);
                    resolve(bmp);
                }catch(e){
                    URL.revokeObjectURL(url);
                    reject(e);
                }
            };
            img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
            img.src = url;
        });
    }

    function triggerDownload(url, filename){
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function safeFilename(name){
        // 去掉路径，只保留文件名；替换非法字符
        const base = String(name).split('/').pop().split('\\').pop();
        return base.replace(/[<>:"/\\|?*\u0000-\u001F]/g, '_') || 'image';
    }

    function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

    // 初始渲染
    render();
</script>
</body>
</html>
