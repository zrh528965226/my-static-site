<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>A/B 文案逐行逐字比对</title>
    <style>
        :root{
            --bg1:#0b1220;
            --bg2:#12263b;
            --card: rgba(255,255,255,.08);
            --border: rgba(255,255,255,.14);
            --text: rgba(255,255,255,.92);
            --muted: rgba(255,255,255,.65);
            --shadow: 0 18px 50px rgba(0,0,0,.35);

            --diff-bg: rgba(255, 99, 99, .22);           /* 淡红遮罩 */
            --diff-underline: rgba(74, 222, 128, .55);  /* 淡绿下划线 */
        }

        *{ box-sizing:border-box; }
        body{
            margin:0;
            min-height:100vh;
            color:var(--text);
            font-family: system-ui, -apple-system, "PingFang SC","Microsoft YaHei", Arial, sans-serif;
            background:
                    radial-gradient(1000px 600px at 10% 10%, rgba(56,189,248,.18), transparent 55%),
                    radial-gradient(900px 600px at 90% 15%, rgba(167,139,250,.16), transparent 55%),
                    linear-gradient(135deg, var(--bg1), var(--bg2));
        }

        .wrap{
            max-width: 1200px;
            margin: 0 auto;
            padding: 22px 16px 40px;
        }

        .topbar{
            display:flex;
            justify-content:space-between;
            align-items:flex-end;
            gap:12px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        h1{
            margin:0;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: .2px;
        }
        .sub{
            margin-top:6px;
            color:var(--muted);
            font-size: 13px;
            line-height: 1.55;
        }

        .card{
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow:hidden;
        }

        .toolbar{
            display:flex;
            gap:10px;
            align-items:center;
            flex-wrap: wrap;
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255,255,255,.10);
        }

        .btn{
            border: 1px solid rgba(255,255,255,.16);
            background: rgba(255,255,255,.08);
            color: var(--text);
            padding: 9px 12px;
            border-radius: 12px;
            cursor:pointer;
            font-weight: 650;
            transition: transform .12s ease, background .12s ease, border-color .12s ease, opacity .12s ease;
            user-select:none;
        }
        .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.11); border-color: rgba(255,255,255,.26); }
        .btn:active{ transform: translateY(0px); opacity:.95; }
        .btn:disabled{ cursor:not-allowed; opacity:.45; transform:none; }

        .toggle{
            display:flex;
            align-items:center;
            gap:8px;
            padding: 8px 10px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,.16);
            background: rgba(255,255,255,.06);
            color: var(--muted);
            font-size: 12px;
            user-select:none;
        }
        .toggle input{ accent-color: #7dd3fc; }

        .status{
            margin-left:auto;
            color: var(--muted);
            font-size: 12px;
        }

        .grid{
            display:grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            padding: 14px;
        }
        @media (max-width: 980px){
            .grid{ grid-template-columns: 1fr; }
        }

        .panel{
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 14px;
            overflow:hidden;
            background: rgba(0,0,0,.14);
        }

        .panel-hd{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap: 10px;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255,255,255,.10);
            background: rgba(255,255,255,.06);
        }
        .panel-hd b{ font-size: 13px; }
        .count{ font-size: 12px; color: var(--muted); }

        textarea{
            width:100%;
            height: 190px;
            resize: vertical;
            padding: 12px;
            border: none;
            outline: none;
            background: rgba(0,0,0,.12);
            color: var(--text);
            font-size: 13px;
            line-height: 1.6;
            font-family: inherit;
            border-bottom: 1px solid rgba(255,255,255,.10);
        }
        /* ✅ 显示框容器：允许上下/左右滚动 */
        .displayWrap{
            padding: 12px;
            min-height: 140px;
            max-height: 360px;      /* 你可按需要调大/调小 */
            background: rgba(0,0,0,.16);
            border-top: 1px solid rgba(255,255,255,.08);

            overflow: auto;         /* 关键：出现滚动条（上下/左右） */
        }

        /* ✅ 内容：保留换行与空格，但不强制折行，便于左右滚动 */
        .display{
            white-space: pre;       /* 保留换行与空格 */
            overflow: visible;
            word-break: normal;     /* 不强制断词 */
            line-height: 1.8;
        }
        /* 可选：滚动条样式（Chrome/Edge） */
        .displayWrap::-webkit-scrollbar{ height: 10px; width: 10px; }
        .displayWrap::-webkit-scrollbar-thumb{
            background: rgba(255,255,255,.18);
            border-radius: 999px;
        }
        .displayWrap::-webkit-scrollbar-track{
            background: rgba(0,0,0,.12);
        }
        /* ✅ 差异样式：淡红遮罩 + 淡绿下划线 */
        .diff{
            background: var(--diff-bg);
            text-decoration-line: underline;
            text-decoration-style: solid;
            text-decoration-color: var(--diff-underline);
            text-decoration-thickness: 2px;
            text-underline-offset: 3px;
            border-radius: 6px;
            padding: 0 1px;
        }

        /* 缺失字符（一方比另一方短）：用可见“空位”占位，保证位置对齐 */
        .miss{
            display:inline-block;
            min-width: 0.6em;
        }

        .badge{
            display:inline-flex;
            align-items:center;
            gap:6px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            border:1px solid rgba(255,255,255,.14);
            background: rgba(255,255,255,.06);
            color: var(--muted);
            white-space: nowrap;
        }
        .ok{ border-color: rgba(74,222,128,.30); background: rgba(74,222,128,.10); color: rgba(255,255,255,.86); }
        .bad{ border-color: rgba(255,99,99,.30); background: rgba(255,99,99,.10); color: rgba(255,255,255,.86); }

        .note{
            color: var(--muted);
            font-size: 12px;
            padding: 10px 14px 0;
            line-height: 1.55;
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="topbar">
        <div>
            <h1>A / B 显示框逐行逐字比对</h1>
            <div class="sub">
                A 显示框只显示 A 输入内容，B 显示框只显示 B 输入内容；然后逐行逐字比对同一位置字符，不同处在两个显示框同时标红并加淡绿下划线。
            </div>
        </div>
        <div class="badge bad" id="resultBadge">等待输入</div>
    </div>

    <div class="card">
        <div class="toolbar">
            <button class="btn" id="compareBtn">比对</button>
            <button class="btn" id="swapBtn">交换 A/B</button>
            <button class="btn" id="clearBtn">清空</button>

            <label class="toggle">
                <input type="checkbox" id="autoToggle" checked />
                自动比对（输入时）
            </label>

            <div class="status" id="statusText">就绪</div>
        </div>

        <div class="grid">
            <!-- A 面板 -->
            <div class="panel">
                <div class="panel-hd">
                    <b>A 输入框</b>
                    <span class="count" id="countA">0 字 / 0 行</span>
                </div>
                <textarea id="inputA" placeholder="在这里输入 A 文案（支持多行）..."></textarea>

                <div class="panel-hd">
                    <b>A 显示框（用于比对高亮）</b>
                    <span class="count" id="diffA">差异：0</span>
                </div>
                <div class="displayWrap">
                    <div id="showA" class="display"></div>
                </div>
            </div>

            <!-- B 面板 -->
            <div class="panel">
                <div class="panel-hd">
                    <b>B 输入框</b>
                    <span class="count" id="countB">0 字 / 0 行</span>
                </div>
                <textarea id="inputB" placeholder="在这里输入 B 文案（支持多行）..."></textarea>

                <div class="panel-hd">
                    <b>B 显示框（用于比对高亮）</b>
                    <span class="count" id="diffB">差异：0</span>
                </div>
                <div class="displayWrap">
                    <div id="showB" class="display"></div>
                </div>
            </div>
        </div>

        <div class="note">
            说明：按“逐行逐字”的同位置对比（包括空格、标点）。如果某行长度不一致，短的一方会在缺失位置也标红（用不可见占位保证对齐）。
        </div>
    </div>
</div>

<script>
    const inputA = document.getElementById('inputA');
    const inputB = document.getElementById('inputB');
    const showA = document.getElementById('showA');
    const showB = document.getElementById('showB');

    const compareBtn = document.getElementById('compareBtn');
    const swapBtn = document.getElementById('swapBtn');
    const clearBtn = document.getElementById('clearBtn');
    const autoToggle = document.getElementById('autoToggle');

    const statusText = document.getElementById('statusText');
    const resultBadge = document.getElementById('resultBadge');

    const countA = document.getElementById('countA');
    const countB = document.getElementById('countB');
    const diffA = document.getElementById('diffA');
    const diffB = document.getElementById('diffB');

    function escapeHTML(str){
        return String(str)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    function splitLinesKeepLastEmpty(s){
        // 保留末尾空行：用 split('\n') 默认就会保留中间空行，但末尾需要特殊处理
        // 这里用简单方式：如果以 \n 结尾，split 后最后会是 ""，刚好符合保留空行需求
        return String(s).replace(/\r\n/g, '\n').split('\n');
    }

    function updateCounts(){
        const a = inputA.value ?? '';
        const b = inputB.value ?? '';
        const la = splitLinesKeepLastEmpty(a).length;
        const lb = splitLinesKeepLastEmpty(b).length;
        countA.textContent = `${a.length} 字 / ${la} 行`;
        countB.textContent = `${b.length} 字 / ${lb} 行`;
    }

    // 核心：逐行逐字对比，同位置不同 -> 两边都标 diff
    function compareAndRender(){
        const aRaw = inputA.value ?? '';
        const bRaw = inputB.value ?? '';

        updateCounts();

        // 先处理空输入
        if (!aRaw && !bRaw){
            showA.textContent = '';
            showB.textContent = '';
            diffA.textContent = '差异：0';
            diffB.textContent = '差异：0';
            setBadge('等待输入', false);
            statusText.textContent = '就绪';
            return;
        }

        statusText.textContent = '比对中…';

        const aLines = splitLinesKeepLastEmpty(aRaw);
        const bLines = splitLinesKeepLastEmpty(bRaw);
        const maxLines = Math.max(aLines.length, bLines.length);

        let outA = '';
        let outB = '';
        let diffCount = 0;

        for (let i = 0; i < maxLines; i++){
            const aLine = aLines[i] ?? '';
            const bLine = bLines[i] ?? '';

            const maxLen = Math.max(aLine.length, bLine.length);

            for (let j = 0; j < maxLen; j++){
                const ca = aLine[j]; // 可能 undefined
                const cb = bLine[j];

                const same = (ca === cb) && (ca !== undefined); // 两边都有且相同
                if (same){
                    outA += escapeHTML(ca);
                    outB += escapeHTML(cb);
                } else {
                    // 不同 or 一边缺失
                    diffCount++;

                    // A 侧字符（缺失用占位空格）
                    if (ca === undefined){
                        outA += `<span class="diff miss">&nbsp;</span>`;
                    } else if (ca === ' '){
                        outA += `<span class="diff">${'&nbsp;'}</span>`;
                    } else {
                        outA += `<span class="diff">${escapeHTML(ca)}</span>`;
                    }

                    // B 侧字符
                    if (cb === undefined){
                        outB += `<span class="diff miss">&nbsp;</span>`;
                    } else if (cb === ' '){
                        outB += `<span class="diff">${'&nbsp;'}</span>`;
                    } else {
                        outB += `<span class="diff">${escapeHTML(cb)}</span>`;
                    }
                }
            }

            // 行末换行（除了最后一行也保留换行显示一致）
            if (i < maxLines - 1){
                outA += '\n';
                outB += '\n';
            }
        }

        showA.innerHTML = outA;
        showB.innerHTML = outB;

        diffA.textContent = `差异：${diffCount}`;
        diffB.textContent = `差异：${diffCount}`;

        if (diffCount === 0 && aRaw === bRaw){
            setBadge('完全一致 ✅', true);
            statusText.textContent = '完成：一致';
        } else {
            setBadge(`存在差异：${diffCount} 处`, false);
            statusText.textContent = '完成：有差异';
        }
    }

    function setBadge(text, ok){
        resultBadge.textContent = text;
        resultBadge.className = 'badge ' + (ok ? 'ok' : 'bad');
    }

    // 事件
    compareBtn.addEventListener('click', compareAndRender);

    swapBtn.addEventListener('click', () => {
        const tmp = inputA.value;
        inputA.value = inputB.value;
        inputB.value = tmp;
        if (autoToggle.checked) compareAndRender();
        else updateCounts();
    });

    clearBtn.addEventListener('click', () => {
        inputA.value = '';
        inputB.value = '';
        compareAndRender();
    });

    function onInput(){
        updateCounts();
        if (autoToggle.checked) compareAndRender();
        else {
            // 不自动比对时，也要让显示框“直接显示输入内容”
            showA.textContent = inputA.value ?? '';
            showB.textContent = inputB.value ?? '';
            diffA.textContent = '差异：-';
            diffB.textContent = '差异：-';
            setBadge('未比对', false);
            statusText.textContent = '就绪（未比对）';
        }
    }

    inputA.addEventListener('input', onInput);
    inputB.addEventListener('input', onInput);

    // 初始
    updateCounts();
    // 默认自动比对开启：先渲染一次（空则无）
    compareAndRender();
</script>
</body>
</html>
